<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-зертханалық жұмыс</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: calm school-lab workbook, precise and friendly.
IDEA: a lab bench with a workbook beside it — apparatus you pick up and wire, a notebook you fill.
PICTURE: the live bench (SVG) takes the first screen of the Experiment tab.
COLOUR and TYPE: deep sea-blue #0b4f6c + teal #0f8b8d + green accent #2bb673; Montserrat titles, Noto Sans body.
LAYOUT: band header, tab strip, two-column bench + instrument panel, tables under it; stacks below 900px.
*/
:root{color-scheme:light dark;
--bg:light-dark(#eaf5f4,#0b1d24);--panel:light-dark(#ffffff,#10262f);--panel2:light-dark(#f3faf9,#14303a);
--ink:light-dark(#10303a,#e3f1f1);--mute:light-dark(#4d6b72,#9bb8bd);--line:light-dark(#cfe3e2,#24434d);
--blue:#0b4f6c;--teal:#0f8b8d;--green:#2bb673;--accent:light-dark(#0f8b8d,#3cc6c3);
--ok:#1f9d55;--bad:#d64545;--warn:#e0a106;--bench:light-dark(#dfeceb,#173540)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans",system-ui,"Segoe UI",Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Montserrat,"Noto Sans",system-ui,sans-serif;line-height:1.15;text-wrap:balance;margin:0 0 .5em}
h2{font-size:24px}h3{font-size:18px}
a{color:var(--accent)}
.top{background:linear-gradient(120deg,#0b4f6c 0%,#0f8b8d 65%,#2bb673 130%);color:#fff;padding:18px max(4vw,14px) 0}
.top .row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.top .kicker{font-size:14px;opacity:.85}
.top h1{font-size:clamp(22px,3.2vw,34px);margin:2px 0 6px;color:#fff}
.top .who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);white-space:nowrap}
.chip b{font-size:16px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:14px;scrollbar-width:thin}
.tabs button{flex:none;border:0;background:rgba(255,255,255,.14);color:#fff;font:600 15px/1 Montserrat,"Noto Sans",sans-serif;padding:13px 16px;border-radius:12px 12px 0 0;cursor:pointer;min-height:44px}
.tabs button:hover{background:rgba(255,255,255,.26)}
.tabs button.on{background:var(--bg);color:var(--ink)}
.tabs button.lock{opacity:.55}
.tabs button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.25);margin-right:6px;font-size:12px}
.tabs button.on .n{background:var(--teal);color:#fff}
.tabs button.done .n{background:var(--green);color:#fff}
main{padding:20px max(4vw,14px) 60px;max-width:1360px;margin:0 auto}
.page{display:none}.page.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.page.on{animation:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.card.soft{background:var(--panel2)}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.prose{max-width:75ch}.prose p{margin:.4em 0 .8em}
.formula{display:block;text-align:center;font:19px/1.4 "Cambria Math","Times New Roman",serif;background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:12px;margin:10px 0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
.fr>span{line-height:1.3}
.var{font-style:italic}
.muted{color:var(--mute)}.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;background:var(--teal);color:#fff;font:600 15px/1.2 Montserrat,"Noto Sans",sans-serif;padding:12px 18px;min-height:44px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #7fd8d2;outline-offset:2px}
.btn.alt{background:var(--blue)}.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.green{background:var(--green)}.btn.red{background:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
input[type=text],input[type=number],select,textarea{font:16px/1.3 "Noto Sans",system-ui,sans-serif;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;min-height:40px;width:100%}
textarea{min-height:140px;resize:vertical}
label.f{display:block;font-weight:600;margin:10px 0 4px}
.quiz .q{padding:12px 0;border-bottom:1px solid var(--line)}
.quiz .q:last-child{border:0}
.quiz .q p{margin:0 0 8px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer;margin:3px 0;border:1.5px solid transparent}
.opt:hover{background:var(--panel2)}
.opt input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--teal)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.rules{counter-reset:r;list-style:none;padding:0;margin:0}
.rules li{counter-increment:r;position:relative;padding:10px 12px 10px 52px;border-radius:12px;background:var(--panel2);margin-bottom:8px}
.rules li::before{content:counter(r);position:absolute;left:12px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.note{border-left:4px solid var(--teal);background:var(--panel2);padding:10px 14px;border-radius:0 12px 12px 0;margin:10px 0}
.note.warn{border-color:var(--warn)}.note.bad{border-color:var(--bad)}.note.ok{border-color:var(--ok)}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media(max-width:1050px){.lab{grid-template-columns:minmax(0,1fr)}}
.benchwrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.benchbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.benchbar .st{font-weight:600;font-size:15px}
.benchbody{display:grid;grid-template-columns:104px minmax(0,1fr)}
@media(max-width:600px){.benchbody{grid-template-columns:minmax(0,1fr)}.palette .pi{min-width:96px!important;width:auto!important}.palette .ph{display:none}.palette{flex-direction:row!important;overflow-x:auto;min-height:0!important;border-right:0!important;border-bottom:1px solid var(--line)}}
.palette{display:flex;flex-direction:column;gap:6px;padding:8px;border-right:1px solid var(--line);background:var(--panel2);min-height:200px}
.palette .pi{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;background:var(--panel);border:1.5px solid var(--line);cursor:grab;touch-action:none;user-select:none;font-size:12px;line-height:1.15;text-align:center;width:100%}
.palette .pi:hover{border-color:var(--teal)}
.palette .pi svg{width:64px;height:40px;pointer-events:none}
.palette .pi.used{opacity:.35;pointer-events:none}
.palette .ph{font-size:12px;color:var(--mute);text-align:center;padding:2px}
.stage{position:relative;background:var(--bench)}
.stage svg.bench{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
svg.bench .part{cursor:grab}svg.bench .part.drag{cursor:grabbing}
svg.bench .term{cursor:crosshair}
svg.bench .term:hover circle.t{stroke:#ff9f1c;stroke-width:3}
svg.bench .wire{cursor:pointer}svg.bench .wire:hover path.w{stroke-dasharray:6 4}
svg.bench [data-ctl]{cursor:pointer}
svg.bench text{pointer-events:none;font-family:"Noto Sans",system-ui,sans-serif}
.side .card{padding:14px 16px}.benchwrap{margin-bottom:6px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.steps li:last-child{border:0}
.steps li i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;margin-top:1px}
.steps li.now i{border-color:var(--teal);color:var(--teal)}
.steps li.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.ok{color:var(--mute)}
.ctrl{display:grid;gap:8px;margin:8px 0}
.ctrl .rowc{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctrl input[type=range]{flex:1;accent-color:var(--teal);min-height:32px}
.readout{font:700 22px/1.2 Montserrat,"Noto Sans",sans-serif;color:var(--accent);white-space:nowrap}
.segs{display:flex;flex-wrap:wrap;gap:4px}
.segs button{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 9px;font-size:14px;cursor:pointer;min-height:36px}
.segs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tablewrap{overflow-x:auto}
table.dt{border-collapse:collapse;width:100%;font-size:14.5px}
table.dt th,table.dt td{border:1px solid var(--line);padding:6px 7px;text-align:center;vertical-align:middle}
table.dt th{background:#0f8b8d;color:#fff;font-weight:600;font-size:13.5px;line-height:1.25}
table.dt th.c{background:#0b4f6c}
table.dt td.rl{font-weight:600;text-align:left;white-space:nowrap;background:var(--panel2)}
table.dt td input{min-width:78px;text-align:center;padding:6px;min-height:36px}
table.dt td select{min-width:220px;font-size:14px}
table.dt td.cc{background:color-mix(in srgb,#0b4f6c 6%,transparent)}
table.dt td.fixed{font-weight:600}
.calcs{display:grid;gap:12px}
.ci{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(120px,.7fr);gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel2)}
.ci .lbl{font-weight:600}.ci .hint{font-size:14px;color:var(--mute)}
.ci .inp{display:flex;align-items:center;gap:6px}.ci .inp span{white-space:nowrap;color:var(--mute)}
@media(max-width:600px){.ci{grid-template-columns:minmax(0,1fr)}}
.stmts .opt{background:var(--panel2)}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.score div{background:var(--panel2);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.score b{display:block;font:700 26px/1.1 Montserrat,"Noto Sans",sans-serif;color:var(--accent)}
.big{font:800 clamp(44px,7vw,72px)/1 Montserrat,"Noto Sans",sans-serif;color:var(--accent)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green))}
.chk{list-style:none;padding:0;margin:0}.chk li{padding:5px 0 5px 28px;position:relative;font-size:14.5px;border-bottom:1px dashed var(--line)}
.chk li::before{content:"";position:absolute;left:4px;top:10px;width:14px;height:14px;border-radius:50%;background:var(--bad)}
.chk li.ok::before{background:var(--ok)}.chk li.half::before{background:var(--warn)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#10303a;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50;max-width:min(560px,92vw);font-size:15px;display:none}
.toast.on{display:block;animation:fade .2s}
.toast.bad{background:#a12c2c}.toast.ok{background:#16794a}.toast.warn{background:#8a6400}
.modal{position:fixed;inset:0;background:rgba(5,20,25,.55);display:none;place-items:center;z-index:60;padding:16px}
.modal.on{display:grid}
.modal .card{max-width:520px;width:100%;margin:0}
.reg{max-width:560px;margin:10px auto}
.lockmsg{padding:40px 20px;text-align:center}
.flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.view{background:#0d1418;border-radius:12px;overflow:hidden}
.view svg,.view canvas{display:block;width:100%;height:auto}
kbd{font:13px monospace;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
@media(max-width:600px){table{font-size:13px}main{padding-top:14px}}
@media print{.top .tabs,.btns,.toast,.noprint{display:none!important}body{background:#fff;color:#000}.page{display:none!important}.page.print{display:block!important}.card{border:1px solid #999;break-inside:avoid}}
.swd{font:700 40px/1.1 "Courier New",ui-monospace,monospace;color:#0b4f6c;background:#e6f4f3;border:2px solid var(--line);border-radius:12px;padding:8px 14px;text-align:right;letter-spacing:1px}
:root[data-theme=dark] .swd{background:#0d2a30;color:#7fe3d9}
.fig{position:relative;min-height:280px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.segs.wts button{min-width:58px}

</style></head><body>

<script>
{
'use strict';
/* ================= Utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
/** number -> string with decimal comma */
function fx(x, d = 2) { if (!isFinite(x)) return '—'; return x.toFixed(d).replace('.', ','); }
function sig(x, n = 3) {
  if (!isFinite(x)) return '—'; if (x === 0) return '0';
  const a = Math.abs(x);
  if (a >= 1e5 || a < 1e-3) { const e = Math.floor(Math.log10(a)); const m = x / 10 ** e; return m.toFixed(n - 1).replace('.', ',') + '·10<sup>' + e + '</sup>'; }
  const d = Math.max(0, n - 1 - Math.floor(Math.log10(a))); return x.toFixed(d).replace('.', ',');
}
function sigTxt(x, n = 3) { return sig(x, n).replace(/<sup>(.*?)<\/sup>/, '^$1'); }
/** parse student number: 1,5  1.5  1,5·10^8  1.5e8  1,5*10^-3  −2 */
function num(s) {
  if (s == null) return NaN; s = String(s).trim().replace(/\s/g, '').replace(/−|–/g, '-').replace(/,/g, '.');
  if (!s) return NaN;
  const m = s.match(/^([-+]?\d*\.?\d+)(?:[·*×xх]10\^?\(?([-+]?\d+)\)?)?$/i);
  if (m) return parseFloat(m[1]) * (m[2] != null ? 10 ** parseInt(m[2]) : 1);
  const n = Number(s); return isFinite(n) ? n : NaN;
}
function near(got, exp, rel = 0.02, abs = 0) { if (!isFinite(got) || !isFinite(exp)) return false; return Math.abs(got - exp) <= Math.max(Math.abs(exp) * rel, abs); }
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const fr = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const V = s => `<span class="var">${s}</span>`;

/* ================= Analog meter drawing ================= */
/** returns SVG markup of an analog dial meter placed at (x,y) with size w×h */
function meterSVG(o) {
  const { x = 0, y = 0, w = 120, h = 90, val = 0, max = 1, divs = 30, unit = 'V', label = '', cls = '', face = '#fbfaf3', body = '#1d3b45', zero = 'left' } = o;
  const cx = x + w / 2, cy = y + h * 0.84, R = Math.min(w * 0.4, h * 0.6);
  const A0 = -50, A1 = 50, span = A1 - A0, fs = Math.max(6, w * 0.056);
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(10, w * .08)}" fill="${body}"/>`;
  s += `<rect x="${x + w * .05}" y="${y + h * .06}" width="${w * .9}" height="${h * .86}" rx="${w * .05}" fill="${face}"/>`;
  const lab = v => { const a = Math.abs(v); if (a === 0) return '0'; return String(+v.toFixed(a >= 10 ? 1 : a >= 1 ? 2 : 3)).replace('.', ','); };
  s += `<path d="M${cx + R * Math.sin(rad(A0))} ${cy - R * Math.cos(rad(A0))} A${R} ${R} 0 0 1 ${cx + R * Math.sin(rad(A1))} ${cy - R * Math.cos(rad(A1))}" fill="none" stroke="#222" stroke-width="1"/>`;
  for (let i = 0; i <= divs; i++) {
    const frac = i / divs, a = rad(A0 + span * frac), major = i % (divs / 6) === 0, half = !major && i % (divs / 12) === 0;
    const r2 = R + (major ? R * .13 : half ? R * .09 : R * .055);
    s += `<line x1="${cx + R * Math.sin(a)}" y1="${cy - R * Math.cos(a)}" x2="${cx + r2 * Math.sin(a)}" y2="${cy - r2 * Math.cos(a)}" stroke="#222" stroke-width="${major ? 1.3 : .6}"/>`;
    if (major) { const v = zero === 'center' ? max * (2 * frac - 1) : max * frac; const r3 = R + R * .13 + fs * .75; s += `<text x="${cx + r3 * Math.sin(a)}" y="${cy - r3 * Math.cos(a) + fs * .35}" font-size="${fs}" text-anchor="middle" fill="#222">${lab(v)}</text>`; }
  }

  f = clamp(f, -0.04, 1.06);
  const na = rad(A0 + span * f), L = R * 1.1;
  s += `<text x="${cx}" y="${cy - R * .3}" font-size="${fs * 1.6}" text-anchor="middle" font-weight="700" fill="#0b4f6c" opacity=".85">${esc(label)}</text>`;
  s += `<text x="${x + w * .09}" y="${y + h * .87}" font-size="${fs * .9}" fill="#555">${esc(unit)}</text>`;
  if (cls) s += `<text x="${x + w * .91}" y="${y + h * .87}" font-size="${fs * .85}" fill="#555" text-anchor="end">${esc(cls)}</text>`;
  s += `<line x1="${cx}" y1="${cy}" x2="${cx + L * Math.sin(na)}" y2="${cy - L * Math.cos(na)}" stroke="#c0262d" stroke-width="${Math.max(1, w * .009)}" stroke-linecap="round"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${w * .03}" fill="#333"/>`;
  return s;
}
function knobSVG(cx, cy, r, frac, label, ctl) {
  const a = rad(-135 + 270 * clamp(frac, 0, 1));
  let s = `<g data-ctl="${ctl}"><circle cx="${cx}" cy="${cy}" r="${r + 5}" fill="transparent"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#26343a" stroke="#0b1418" stroke-width="2"/>`;

  if (label) s += `<text x="${cx}" y="${cy + r + 14}" font-size="11" text-anchor="middle" fill="#cfe">${esc(label)}</text>`;
  return s;

/* ================= Bench: drag parts + connect wires ================= */
const WIRE_COLORS = ['#d62828', '#1d3557', '#2a9d8f', '#e9c46a', '#6a4c93', '#f77f00'];
class Bench {
  constructor(host, o = {}) {

/* ================= DC circuit solver (nodal analysis, companion models) ================= */
/** elems: {k:'R',a,b,R} | {k:'V',a,b,E,r} (a = +) | {k:'L',a,b,Rc,Rh,Un} lamp | {k:'D',a,b,Is,n,Rs,Rl} diode (a = anode)
 *  a/b are bench terminal names ('src.p') or internal names starting with '#'. Returns {V(t), I(i), elems}. */
function solveCircuit(elems, nets) {
  const idx = new Map(); const node = t => { const r = t[0] === '#' ? t : nets.root(t); if (!idx.has(r)) idx.set(r, idx.size); return idx.get(r); };
  const E = [];
  elems.forEach((e, i) => { if (e.k === 'D' && e.Rs) { const mid = '#d' + i; E.push({ k: 'R', a: e.a, b: mid, R: e.Rs, src: i }); E.push({ ...e, a: mid, Rs: 0, src: i, main: 1 }); } else E.push({ ...e, src: i, main: 1 }); });
  for (const e of E) { e.na = node(e.a); e.nb = node(e.b); if (e.k === 'L') e.Rcur = e.Rc; }
  const N = idx.size; let V = new Float64Array(N);
  const src = E.find(e => e.k === 'V'); const gnd = src ? src.nb : 0;
  const nonlin = E.some(e => e.k === 'L' || e.k === 'D');
  const lampR = (e, v) => e.Rc + (e.Rh - e.Rc) * Math.pow(Math.min(1.4, Math.abs(v) / e.Un), 0.55);
  const dI = (e, v) => { const nVt = e.n * 0.02585, ex = Math.exp(Math.min(v / nVt, 80)); return [e.Is * (ex - 1) + v / e.Rl, e.Is * ex / nVt + 1 / e.Rl]; };
  for (let it = 0; it < 200 && N; it++) {
    const G = Array.from({ length: N }, () => new Float64Array(N + 1));
    const st = (a, b, g) => { G[a][a] += g; G[b][b] += g; G[a][b] -= g; G[b][a] -= g; };
    const inj = (a, b, i) => { G[a][N] += i; G[b][N] -= i; };
    for (let i = 0; i < N; i++) G[i][i] += 1e-9;
    for (const e of E) {
      const vd = V[e.na] - V[e.nb];
      if (e.k === 'R') st(e.na, e.nb, 1 / Math.max(e.R, 1e-4));
      else if (e.k === 'V') { const g = 1 / Math.max(e.r, 1e-4); st(e.na, e.nb, g); inj(e.na, e.nb, e.E * g); }
      else if (e.k === 'L') { e.Rcur = e.Rcur * .5 + lampR(e, vd) * .5; st(e.na, e.nb, 1 / e.Rcur); }
      else if (e.k === 'D') { const v = clamp(vd, -60, 1.5); const [id, gd] = dI(e, v); st(e.na, e.nb, gd); inj(e.na, e.nb, -(id - gd * v)); }
    }
    G[gnd].fill(0); G[gnd][gnd] = 1; G[gnd][N] = 0;
    for (let c = 0; c < N; c++) { let p = c; for (let r = c + 1; r < N; r++) if (Math.abs(G[r][c]) > Math.abs(G[p][c])) p = r; [G[c], G[p]] = [G[p], G[c]]; const d = G[c][c] || 1e-30; for (let r = 0; r < N; r++) { if (r === c) continue; const f = G[r][c] / d; if (f) for (let k = c; k <= N; k++) G[r][k] -= f * G[c][k]; } }
    const Vn = new Float64Array(N); for (let i = 0; i < N; i++) Vn[i] = G[i][N] / (G[i][i] || 1e-30);
    if (!nonlin) { V = Vn; break; }
    let mx = 0; for (let i = 0; i < N; i++) mx = Math.max(mx, Math.abs(Vn[i] - V[i]));
    const s = mx > .3 ? .3 / mx : 1; for (let i = 0; i < N; i++) V[i] += (Vn[i] - V[i]) * s;
    if (mx < 1e-8) break;
  }
  const volt = t => { const r = t[0] === '#' ? t : nets.root(t); return idx.has(r) ? V[idx.get(r)] : 0; };
  const cur = i => { const e = E.find(x => x.src === i && x.main); if (!e) return 0; const vd = V[e.na] - V[e.nb];
    if (e.k === 'R') return vd / Math.max(e.R, 1e-4); if (e.k === 'V') return (e.E - vd) / Math.max(e.r, 1e-4); if (e.k === 'L') return vd / e.Rcur; if (e.k === 'D') return dI(e, vd)[0]; return 0; };
  return { V: volt, I: cur };
}

/* ================= Stopwatch ================= */
class Stopwatch {
  constructor(el, o = {}) {
    this.el = el; this.o = o; this.acc = 0; this.run = false; this.laps = [];
    el.innerHTML = `<div class="sw"><div class="swd" aria-live="off">0,00 с</div><div class="btns" style="margin-top:8px"><button class="btn sm green" data-a="ss">Бастау</button>${o.laps ? '<button class="btn sm alt" data-a="lap">Аралық уақыт</button>' : ''}<button class="btn sm ghost" data-a="rst">Нөлдеу</button></div><div class="swl small muted"></div><p class="small muted" style="margin:6px 0 0">Пернетақтадағы <kbd>Бос орын</kbd> батырмасы да секундомерді қосады/тоқтатады${o.laps ? ', <kbd>L</kbd> — аралық уақыт' : ''}.</p></div>`;
    el.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; ({ ss: () => this.toggle(), lap: () => this.lap(), rst: () => this.reset() })[b.dataset.a](); });
    window.addEventListener('keydown', e => { const tg = document.activeElement?.tagName || ''; if (/INPUT|TEXTAREA|SELECT/.test(tg)) return; if (!this.el.isConnected || !this.el.offsetParent) return; if (e.code === 'Space') { e.preventDefault(); if (tg === 'BUTTON') document.activeElement.blur(); if (!e.repeat) this.toggle(); } if (e.code === 'KeyL' && o.laps && !e.repeat) this.lap(); });
    this.draw();
  }
  now() { return this.o.clock ? this.o.clock() : performance.now() / 1000; }
  value() { return this.acc + (this.run ? this.now() - this.t0 : 0); }
  toggle() { this.run ? this.stop() : this.start(); }
  start() { if (this.run) return; this.t0 = this.now(); this.run = true; this.o.onStart?.(); const f = () => { if (!this.run) return; this.draw(); requestAnimationFrame(f); }; f(); }
  stop() { if (!this.run) return; this.acc = this.value(); this.run = false; this.draw(); this.o.onStop?.(Math.round(this.acc * 100) / 100); }
  lap() { if (!this.run) return; const v = Math.round(this.value() * 100) / 100; this.laps.push(v); this.o.onLap?.(v); this.draw(); }
  reset() { if (this.run) return App.toast('Алдымен секундомерді тоқтатыңыз', 'warn'); this.acc = 0; this.laps = []; this.draw(); this.o.onReset?.(); }
  draw() { $('.swd', this.el).textContent = fx(Math.floor(this.value() * 100) / 100, 2) + ' с'; const b = $('[data-a=ss]', this.el); b.textContent = this.run ? 'Тоқтату' : 'Бастау'; b.className = 'btn sm ' + (this.run ? 'red' : 'green'); $('.swl', this.el).innerHTML = this.laps.length ? 'Аралық уақыттар: ' + this.laps.map((l, i) => `<span class="tag">${i + 1}) ${fx(l, 2)} с</span>`).join(' ') : ''; }
}

/* ================= Lever balance with a set of weights ================= */
const WSET = [[50, '50 г'], [20, '20 г'], [20, '20 г'], [10, '10 г'], [5, '5 г'], [2, '2 г'], [2, '2 г'], [1, '1 г'], [.5, '500 мг'], [.2, '200 мг'], [.2, '200 мг'], [.1, '100 мг'], [.05, '50 мг'], [.02, '20 мг'], [.02, '20 мг'], [.01, '10 мг']];
class Balance {
  constructor(el, o = {}) {
    this.el = el; this.o = o; this.on = new Set(); this.free = false; this.ang = 0;
    el.innerHTML = `<div class="view" style="background:#f3f8f8"><svg viewBox="0 0 320 200" class="bal"></svg></div><div class="btns"><button class="btn sm" data-a="arr">Таразыны босату</button></div><div class="small muted" style="margin:6px 0">Өлшемтастар жәшігі (басу — оң табақшаға қою, табақшадағы тасты басу — алу):</div><div class="segs wts">${WSET.map((w, i) => `<button data-w="${i}">${w[1]}</button>`).join('')}</div><p class="small muted bsum"></p>`;
    el.addEventListener('click', e => { const w = e.target.closest('[data-w]'); const a = e.target.closest('[data-a]'); const pw = e.target.closest('[data-pw]');
      if (a) { this.free = !this.free; this.draw(); return; }
      const i = w ? +w.dataset.w : pw ? +pw.dataset.pw : null; if (i == null) return;
      if (this.free) { App.violation('өлшемтасты таразы босатулы (арретирсіз) кезде қойды/алды'); }
      this.on.has(i) ? this.on.delete(i) : this.on.add(i); this.draw(); o.onChange?.(this.sum()); });
    const tick = () => { if (!el.isConnected) return; const t = this.target(); if (Math.abs(t - this.ang) > .02) { this.ang += (t - this.ang) * .12; this.drawBeam(); } requestAnimationFrame(tick); }; tick(); this.draw();
  }
  sum() { let s = 0; for (const i of this.on) s += WSET[i][0]; return Math.round(s * 1000) / 1000; }
  target() { const L = this.o.load?.(); if (!this.free) return 0; const d = (L ? L.m : 0) - this.sum(); return clamp(deg(Math.atan(d / .012)) * .14, -11, 11); }
  draw() {
    $$('.wts button', this.el).forEach(b => b.classList.toggle('on', this.on.has(+b.dataset.w)));
    const a = $('[data-a=arr]', this.el); a.textContent = this.free ? 'Таразыны арретирлеу (тоқтату)' : 'Таразыны босату'; a.className = 'btn sm ' + (this.free ? 'alt' : '');
    $('.bsum', this.el).textContent = this.on.size ? `Табақшада: ${[...this.on].sort((x, y) => WSET[y][0] - WSET[x][0]).map(i => WSET[i][1]).join(' + ')}` : 'Оң табақша бос.';
    this.drawBeam();
  }
  drawBeam() {
    const L = this.o.load?.(); const a = rad(this.ang); const cx = 160, cy = 60, h = 120;
    const lx = cx - h * Math.cos(a), ly = cy - h * Math.sin(a), rx = cx + h * Math.cos(a), ry = cy + h * Math.sin(a);
    let s = `<rect x="150" y="60" width="20" height="120" fill="#5f6b70"/><rect x="100" y="178" width="120" height="14" rx="4" fill="#3d474b"/>`;
    s += `<path d="M120 150 A40 40 0 0 1 200 150" fill="none" stroke="#333"/>${[-10, -5, 0, 5, 10].map(d => { const t = rad(d * 4); return `<line x1="${160 + 40 * Math.sin(t)}" y1="${150 - 40 * Math.cos(t)}" x2="${160 + 46 * Math.sin(t)}" y2="${150 - 46 * Math.cos(t)}" stroke="#333" stroke-width="${d ? 1 : 2}"/>`; }).join('')}`;
    s += `<line x1="160" y1="60" x2="${160 - 85 * Math.sin(a * 4)}" y2="${60 + 85 * Math.cos(a * 4)}" stroke="#c0262d" stroke-width="2.5"/>`;
    s += `<line x1="${lx}" y1="${ly}" x2="${rx}" y2="${ry}" stroke="#334" stroke-width="5" stroke-linecap="round"/><circle cx="160" cy="60" r="6" fill="#222"/>`;
    const pan = (x, y, side) => `<line x1="${x}" y1="${y}" x2="${x - 26}" y2="${y + 62}" stroke="#666"/><line x1="${x}" y1="${y}" x2="${x + 26}" y2="${y + 62}" stroke="#666"/><path d="M${x - 32} ${y + 62} Q${x} ${y + 78} ${x + 32} ${y + 62}Z" fill="#c9d3d6" stroke="#556"/>`;
    s += pan(lx, ly) + pan(rx, ry);
    if (L) s += `<circle cx="${lx}" cy="${ly + 54}" r="10" fill="#9aa7ad" stroke="#334"/><text x="${lx}" y="${ly + 40}" font-size="10" text-anchor="middle" fill="#123">${esc(L.name)}</text>`;
    let k = 0; for (const i of [...this.on].sort((x, y) => WSET[y][0] - WSET[x][0])) { const w = WSET[i][0], sz = 5 + Math.log10(w * 100 + 1) * 3.2; const x = rx - 24 + (k % 4) * 14, y = ry + 58 - Math.floor(k / 4) * 13; s += `<g data-pw="${i}" style="cursor:pointer"><rect x="${x - sz / 2}" y="${y - sz}" width="${sz}" height="${sz}" rx="2" fill="${w >= 1 ? '#b08d57' : '#cfd8dc'}" stroke="#555"/></g>`; k++; }
    s += `<text x="8" y="16" font-size="11" fill="#456">${this.free ? 'Таразы босатулы — тілше теңгерімді көрсетеді' : 'Таразы арретирленген (тоқтатылған)'}</text>`;
    $('svg.bal', this.el).innerHTML = s;
  }
}

/* ================= Simple XY plot ================= */
function niceStep(range, n = 5) { const r = range / n, p = 10 ** Math.floor(Math.log10(r)); const m = r / p; return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p; }
function plotXY(svg, o) {
  const W = svg.clientWidth || 600, H = svg.clientHeight || 300; svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const all = o.series.flatMap(s => s.pts).filter(p => isFinite(p[0]) && isFinite(p[1]));
  let x0 = o.xmin ?? Math.min(0, ...all.map(p => p[0])), x1 = o.xmax ?? Math.max(1e-9, ...all.map(p => p[0])), y0 = o.ymin ?? Math.min(0, ...all.map(p => p[1])), y1 = o.ymax ?? Math.max(1e-9, ...all.map(p => p[1]));
  if (!all.length) { x1 = o.xmax ?? 1; y1 = o.ymax ?? 1; }
  const sx = niceStep(x1 - x0), sy = niceStep(y1 - y0); x0 = Math.floor(x0 / sx) * sx; x1 = Math.ceil(x1 / sx) * sx; y0 = Math.floor(y0 / sy) * sy; y1 = Math.ceil(y1 / sy) * sy;
  const m = { l: 52, r: 14, t: 16, b: 40 }; const X = x => m.l + (x - x0) / (x1 - x0) * (W - m.l - m.r), Y = y => H - m.b - (y - y0) / (y1 - y0) * (H - m.t - m.b);
  const lab = v => String(+v.toPrecision(4)).replace('.', ',');
  let s = '';
  for (let y = y0; y <= y1 + 1e-9; y += sy) s += `<line x1="${m.l}" y1="${Y(y)}" x2="${W - m.r}" y2="${Y(y)}" stroke="var(--line)"/><text x="${m.l - 6}" y="${Y(y) + 4}" font-size="12" text-anchor="end" fill="var(--mute)">${lab(y)}</text>`;
  for (let x = x0; x <= x1 + 1e-9; x += sx) s += `<line x1="${X(x)}" y1="${m.t}" x2="${X(x)}" y2="${H - m.b}" stroke="var(--line)" opacity=".5"/><text x="${X(x)}" y="${H - m.b + 16}" font-size="12" text-anchor="middle" fill="var(--mute)">${lab(x)}</text>`;
  if (x0 < 0 && x1 > 0) s += `<line x1="${X(0)}" y1="${m.t}" x2="${X(0)}" y2="${H - m.b}" stroke="var(--mute)"/>`; if (y0 < 0 && y1 > 0) s += `<line x1="${m.l}" y1="${Y(0)}" x2="${W - m.r}" y2="${Y(0)}" stroke="var(--mute)"/>`;
  s += `<text x="${(W + m.l) / 2}" y="${H - 6}" font-size="12" text-anchor="middle" fill="var(--ink)">${o.xl || ''}</text><text x="8" y="12" font-size="12" fill="var(--ink)">${o.yl || ''}</text>`;
  for (const se of o.series) {
    const P = se.pts.filter(p => isFinite(p[0]) && isFinite(p[1])); if (!P.length) continue;
    if (se.join) s += `<path d="${[...P].sort((a, b) => a[0] - b[0]).map((p, i) => (i ? 'L' : 'M') + X(p[0]) + ' ' + Y(p[1])).join(' ')}" fill="none" stroke="${se.color}" stroke-width="2"/>`;
    if (se.fit === 'line0' && P.length > 1) { const k = P.reduce((a, p) => a + p[0] * p[1], 0) / P.reduce((a, p) => a + p[0] * p[0], 0); s += `<line x1="${X(x0)}" y1="${Y(k * x0)}" x2="${X(x1)}" y2="${Y(k * x1)}" stroke="${se.color}" stroke-width="1.5" stroke-dasharray="6 4"/>`; }
    if (se.fit === 'line' && P.length > 1) { const n = P.length, mx = mean(P.map(p => p[0])), my = mean(P.map(p => p[1])); const k = P.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0) / (P.reduce((a, p) => a + (p[0] - mx) ** 2, 0) || 1); const b = my - k * mx; s += `<line x1="${X(x0)}" y1="${Y(k * x0 + b)}" x2="${X(x1)}" y2="${Y(k * x1 + b)}" stroke="${se.color}" stroke-width="1.5" stroke-dasharray="6 4"/>`; }
    s += P.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.5" fill="${se.color}"/>`).join('');
  }
  if (o.series.length > 1) s += o.series.map((se, i) => `<rect x="${m.l + 10 + i * 150}" y="${m.t}" width="12" height="12" rx="3" fill="${se.color}"/><text x="${m.l + 27 + i * 150}" y="${m.t + 10}" font-size="12" fill="var(--ink)">${esc(se.name || '')}</text>`).join('');
  if (!all.length) s += `<text x="${W / 2}" y="${H / 2}" font-size="14" text-anchor="middle" fill="var(--mute)">${o.empty || 'Кестеге мәндер енгізіңіз'}</text>`;
  svg.innerHTML = s;
}

  glow: {}, disp: {}, read: {},
  mult(c) { return c.unit === 'мА' ? 1e-3 : c.unit === 'мкА' ? 1e-6 : 1; },
  /** build solver elements from placed parts */
  elems(B) {
    const S = App.S, E = [], map = {};
    for (const p of B.parts.values()) {
      const d = p.def, c = d.cfg || {}, id = p.id, st = S.ex.ek?.[id] || {};
      const add = (e, tag) => { map[id + (tag || '')] = E.length; E.push(e); };
      if (d.type === 'src' || d.type === 'bat') add({ k: 'V', a: id + '.p', b: id + '.n', E: c.E, r: c.r });
      else if (d.type === 'key') { if (st.on) add({ k: 'R', a: id + '.a', b: id + '.b', R: .002 }); }
      else if (d.type === 'rh') { add({ k: 'R', a: id + '.a', b: id + '.c', R: c.R * st.x + .02 }, ':ac'); add({ k: 'R', a: id + '.c', b: id + '.b', R: c.R * (1 - st.x) + .02 }, ':cb'); }
      else if (d.type === 'lamp') add({ k: 'L', a: id + '.a', b: id + '.b', Rc: c.Rc, Rh: c.Rh, Un: c.Un });
      else if (d.type === 'res') add({ k: 'R', a: id + '.a', b: id + '.b', R: c.R });
      else if (d.type === 'diode') add({ k: 'D', a: id + '.a', b: id + '.k', Is: c.Is, n: c.n, Rs: c.Rs, Rl: c.Rl });
      else if (d.type === 'V') add({ k: 'R', a: id + '.p', b: id + '.n', R: (c.ohmPerV || 1000) * (st.rng || 1) });
      else if (d.type === 'A') add({ k: 'R', a: id + '.p', b: id + '.n', R: (c.drop || .075) / ((st.rng || 1) * EK.mult(c)) });
    }
    return { E, map };
  },
  /** solve and fill EK.read (base SI units) and EK.glow; returns solution */
  solve(B) {
    const { E, map } = this.elems(B); this.read = {}; this.glow = {}; if (!E.some(e => e.k === 'V')) { for (const p of B.parts.values()) if (p.def.type === 'V' || p.def.type === 'A') this.read[p.id] = 0; return null; }
    const sol = solveCircuit(E, B.nets()); this.sol = sol; this.map = map;
    for (const p of B.parts.values()) { const d = p.def, c = d.cfg || {}; if (d.type === 'V') this.read[p.id] = sol.V(p.id + '.p') - sol.V(p.id + '.n'); if (d.type === 'A') this.read[p.id] = sol.I(map[p.id]); if (d.type === 'lamp') { const i = sol.I(map[p.id]), u = sol.V(p.id + '.a') - sol.V(p.id + '.b'); this.glow[p.id] = Math.abs(u * i) / (c.Pn || 1); } }
    return sol;
  },
  cur(id) { return this.sol ? this.sol.I(this.map[id]) : 0; },
  /** checks: overload / polarity / short. calls App.violation; returns list of warnings */
  safety(B, srcLimit = 3) {
    const S = App.S, w = [];
    for (const p of B.parts.values()) { const d = p.def, c = d.cfg || {}; if (d.type !== 'V' && d.type !== 'A') continue; const st = S.ex.ek[p.id]; const v = this.read[p.id] / this.mult(c); const nm = c.sym || p.id;
      if (v > st.rng * 1.05) w.push(`${nm}: тілше шкаладан шықты — өлшеу шегін үлкейтіңіз`); if (v > st.rng * 2) App.violation(`${nm} аспабы асқын жүктелді`);
      if (v < -st.rng * .03) { w.push(`${nm}: тілше кері ауытқыды — «+» және «−» қысқыштарын ауыстырыңыз`); if (v < -st.rng * .3) App.violation(`${nm} аспабының полярлығы сақталмады`); } }
    for (const p of B.parts.values()) if (p.def.type === 'src' || p.def.type === 'bat') { const i = this.cur(p.id); if (i > srcLimit) { w.push('Ток көзі арқылы өте үлкен ток өтуде — қысқа тұйықталу!'); App.violation('қысқа тұйықталу (ток көзі арқылы шамадан тыс ток)'); } }
    return w;
  },
  /** big meter panel html + draw */
  panel(ids, B) { return ids.map(id => { const c = B.defs.get(id).cfg; return `<div class="view" style="background:#163640;margin-top:8px"><svg id="big_${id}" viewBox="0 0 300 190"></svg></div>${rangeSegs('rg_' + id, c.ranges, App.S.ex.ek?.[id]?.rng ?? c.ranges[c.ranges.length - 1], c.sym + ', ' + c.unit)}`; }).join(''); },
  bindPanel(ids, B, onCh) { for (const id of ids) { const el = $('#rg_' + id); if (!el) continue; el.onclick = e => { const b = e.target.closest('button'); if (!b) return; App.S.ex.ek[id] ??= {}; App.S.ex.ek[id].rng = +b.dataset.v; $$('button', el).forEach(x => x.classList.toggle('on', x === b)); App.save(); onCh(); }; } },
  drawPanel(ids, B) { for (const id of ids) { const sv = $('#big_' + id); if (!sv) continue; const c = B.defs.get(id).cfg, st = App.S.ex.ek?.[id] || {}; const on = B.has(id); sv.innerHTML = meterSVG({ divs: c.divs || 30, x: 4, y: 4, w: 292, h: 182, val: on ? (this.disp[id] || 0) / this.mult(c) : 0, max: st.rng || c.ranges[c.ranges.length - 1], label: c.sym, unit: `${c.unit}, шек ${String(st.rng).replace('.', ',')}`, cls: c.cls ? 'класс ' + String(c.cls).replace('.', ',') : '', body: '#163640' }) + (on ? '' : '<text x="150" y="60" font-size="12" text-anchor="middle" fill="#d33">аспап үстелде жоқ</text>'); } },
  /** smooth needles; call every frame */
  animate(B, ids) { let ch = false; for (const id of ids) { const t = this.read[id] || 0, d = this.disp[id] || 0; if (Math.abs(t - d) > Math.abs(t) * 1e-4 + 1e-9) { this.disp[id] = d + (t - d) * .2; ch = true; } } if (ch) { for (const id of ids) if (B.has(id)) B.redraw(id); this.drawPanel(ids, B); } }
};

  checkAssembly(A) {

    if (!B.has('stand')) return { ok: false, msg: 'Штатив қойылмаған.' }; if (!B.has('card') || B.get('card').x !== B.get('stand').x + 60) return { ok: false, msg: 'Қатырма қағазды штатив қысқышына бекітіңіз.' };
    if (!this.attached('r1') && !this.attached('r2')) return { ok: false, msg: 'Резеңке жіп қысқышқа байланбаған.' }; if (!S.ex.hk) return { ok: false, msg: 'Ілгек жіптің ұшына ілінбеген.' };
    if (!S.ex.marks.some(m => m.M === 0)) return { ok: false, msg: 'Жүк ілмей тұрып, жіп ұшының бастапқы деңгейін белгілеңіз.' };
    return { ok: true, msg: 'Қондырғы дайын! Жүктерді кезекпен іліп, деңгейлерді белгілеңіз.' };
  },
  gradeMeasure(A) {
    const S = A.S, T = A.T, out = []; const mmPerN = 1000 / T.kd; const D = S.ex.dyn;
    [1, 2, 3].forEach((k, r) => out.push(A.item(`Динамометр: ${k} Н белгісінің қашықтығы дұрыс өлшенген`, D.marks.includes(k) && near(A.cell('g', r, 'x'), k * .102 * G * mmPerN, 0, .7) ? 1 : 0, .5)));
    out.push(A.item('Аралықтар 10 бөлікке бөлінген', D.div ? 1 : 0, .3));
    const Fb = T.mb / 1000 * G; out.push(A.item('Гайкалар жиыны өз динамометріммен өлшенген', near(A.cell('c', 0, 'f1'), Fb, 0, .07) ? 1 : 0, .5)); out.push(A.item('Гайкалар жиыны зауыттық динамометрмен өлшенген', D.fac && near(A.cell('c', 0, 'f2'), Fb, 0, .06) ? 1 : 0, .4));
    for (let r = 0; r < 6; r++) { const n = r < 3 ? 1 : 2, m = MS[r % 3]; const exp = m / 1000 * G / this.kc(n) * 1000; const done = S.ex.log.some(l => l.n === n && l.M === m); out.push(A.item(`${r < 3 ? 'Бір' : 'Екі'} жіп, ${m} г: ұзару дұрыс өлшенген`, done && near(A.cell('t', r, 'dx'), exp, .03, 1) ? 1 : done && near(A.cell('t', r, 'dx'), exp, .07, 2) ? .5 : 0, .5)); }
    return out;
  },
  gradeCalc(A) {
    const S = A.S, T = A.T, out = [];
    [0, 1, 2].forEach(r => out.push(A.chk(`Динамометр: ${r + 1}-аралық`, A.tv('g', r, 'dx'), A.cell('g', r, 'x') - (r ? A.cell('g', r - 1, 'x') : 0), .01, .1, .3)));
    const k = []; for (let r = 0; r < 6; r++) { const F = MS[r % 3] / 1000 * G; out.push(A.chk(`${r + 1}-жол: F`, A.tv('t', r, 'F'), F, .01, .001, .3)); const kk = F / (A.cell('t', r, 'dx') / 1000); k.push(kk); out.push(A.chk(`${r + 1}-жол: k`, A.tv('t', r, 'k'), kk, .02, .05, .4)); }
    const k1 = mean(k.slice(0, 3).filter(isFinite)), k2 = mean(k.slice(3).filter(isFinite)); out.push(A.chk('k₁', S.calc.k1, k1, .02, .05)); out.push(A.chk('k₂', S.calc.k2, k2, .02, .05)); out.push(A.chk('k₂/k₁', S.calc.r, num(S.calc.k2) / num(S.calc.k1), .02, .02));
    out.push(A.chk('Динамометрлер айырмасы', S.calc.dd, Math.abs(A.cell('c', 0, 'f1') - A.cell('c', 0, 'f2')), .1, .02));
    out.push(A.chk('Нәтиже: k₁ шын мәнге жақын (±6 %)', S.calc.k1, T.k1, .06, 0, 1.5));
    return out;
  }
};
App.init(LAB);
