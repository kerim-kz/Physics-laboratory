# Render Blueprint — бір батырмамен жариялау: сайт + Postgres дерекқоры бірге жасалады.
# Алғашқы іске қосуда тек ADMIN_LOGIN, ADMIN_PASSWORD, ADMIN_NAME сұралады.
# Файлдар дерекқорда сақталады (FILE_STORAGE=db), себебі тегін Render-дің дискі тұрақсыз.
# Ескерту: тегін Render Postgres 30 күннен кейін ақылы жоспарға ауыстыруды талап етеді
# (немесе DATABASE_URL-ды тегін Neon дерекқорына ауыстыруға болады — README-ді қараңыз).
databases:
  - name: gylym-ordasy-db
    plan: free
    region: frankfurt
    databaseName: fizika
    user: fizika

services:
  - type: web
    name: gylym-ordasy
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: FILE_STORAGE
        value: db
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: gylym-ordasy-db
          property: connectionString
      - key: ADMIN_LOGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
